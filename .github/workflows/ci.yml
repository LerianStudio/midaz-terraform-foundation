name: Terraform CI/CD

# Trigger workflow on push to main/develop and PR events
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types:
      - opened      # When PR is created
      - edited      # When PR description/title is edited
      - synchronize # When PR receives new commits
      - reopened    # When PR is reopened

permissions:
  id-token: write       # Needed for authentication
  contents: write       # Needed to create releases and tags
  pull-requests: write  # Needed to create/update PRs

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    # Checkout repository code in PR
    - name: Checkout in PR
      uses: actions/checkout@v4
      if: github.event_name == 'pull_request'
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0

    # Checkout repository code in push
    - name: Checkout in push
      uses: actions/checkout@v4
      if: github.event_name == 'push'
      with:
        fetch-depth: 0

    # Setup Node.js environment for commitlint
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - run: npm install
    # Run the commitlint action, considering its own dependencies and yours as well 🚀
    # `github.workspace` is the path to your repository.
    # Ensure commits follow conventional commits specification
    - uses: wagoid/commitlint-github-action@v6
      env:
        NODE_PATH: ${{ github.workspace }}/node_modules

    # Install Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    # Install TFLint for Terraform linting
    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4

    - name: Cache plugin dir
      uses: actions/cache@v4
      with:
        path: ~/.tflint.d/plugins
        key: ${{ matrix.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

    # Check Terraform files formatting
    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    # Initialize and validate every Terraform directory.
    #
    # Directories are DISCOVERED, not listed. The previous hand-maintained list
    # had already drifted: examples/aws/amazonmq, the three documentdb stacks,
    # examples/azure/cosmosdb and examples/azure/base-resources were deployable
    # but never checked, and any new directory silently escaped CI until someone
    # remembered to edit this file.
    #
    # A versions.tf is the marker every root module and child module in this
    # repository carries. terraform -chdir replaces the old cd chain, where one
    # wrong ../ silently validated the wrong directory.
    - name: Terraform Init and Validate
      run: |
        set -euo pipefail
        dirs=$(find examples -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
        if [ -z "$dirs" ]; then
          echo "No Terraform directories found - the discovery glob is wrong." >&2
          exit 1
        fi
        echo "Discovered Terraform directories:"
        echo "$dirs"
        for dir in $dirs; do
          echo "::group::$dir"
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" validate
          echo "::endgroup::"
        done

    # Run TFLint on all Terraform files
    - name: Init TFLint
      run: tflint --init
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Run TFLint
      run: |
        # Find all .tf files recursively, excluding .terraform directories, and get unique directories
        dirs=$(find . -type f -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u)

        # Loop through each directory and run tflint using root config
        for dir in $dirs; do
          echo "Linting $dir"
          tflint --chdir="$dir" --config="${{ github.workspace }}/.tflint.hcl"
        done

    # Security scan Terraform code
    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        additional_args: "--exclude aws-ssm-secret-use-customer-key,aws-ssm-secret-use-customer-key,aws-ec2-no-public-egress-sgr,aws-ec2-require-vpc-flow-logs-for-all-vpcs,google-sql-encrypt-in-transit-data,google-gke-enable-private-cluster,google-gke-enable-network-policy,google-gke-enforce-pod-security-policy,aws-mq-enable-audit-logging,aws-documentdb-encryption-customer-key"

  # cmd/lerian-infra and pkg/infra, kept entirely separate from the Terraform job:
  # they share a repository because the tool is coupled by design to this layout,
  # not a toolchain.
  go:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Read from go.mod so the version lives in exactly one place.
        go-version-file: go.mod
        cache: true

    - name: Go Build
      run: go build ./...

    - name: Go Vet
      run: go vet ./...

    # gofmt exits 0 whether or not it found anything; the file list on stdout is
    # the whole result, so it has to be turned into an exit code by hand.
    - name: Go Format Check
      run: |
        set -euo pipefail
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:" >&2
          echo "$unformatted" >&2
          exit 1
        fi

    - name: Go Test
      run: go test ./... -cover

  release:
    # Both jobs gate the release: a tag cut from a tree where cmd/lerian-infra
    # does not compile ships a broken tool alongside working Terraform.
    needs: [validate, go]  # Only run after validation succeeds
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'push'
    steps:
    # Create GitHub App token for better rate limits
    - uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
        private-key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

    # Checkout code with full history for versioning
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history needed for semantic versioning
        token: ${{ steps.app-token.outputs.token }}

    # Setup GPG for signed commits and tags
    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v6
      id: import_gpg
      with:
        gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
        passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
        git_committer_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
        git_committer_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true

    # Setup Node.js for semantic-release
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    # Create new release with semantic versioning
    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v4
      id: semantic
      with:
        ci: false
        semantic_version: 23.0.8
        extra_plugins: |
          conventional-changelog-conventionalcommits@v7.0.2
          @saithodev/semantic-release-backmerge
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
        GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
        GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
        GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}